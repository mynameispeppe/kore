shadows:
  light:
    shadow-rest: "0 1px 2px rgba(33, 33, 33, 0.04)"
    shadow-hover: "0 4px 12px rgba(33, 33, 33, 0.06)"
    shadow-raised: "inset 0 1px 0 rgb(255 255 255 / .25), inset 0 -2px 0 rgb(0 0 0 / .18), 0 2px 4px rgb(0 0 0 / .12), 0 4px 10px rgb(0 0 0 / .08)"
    shadow-raised-hover: "inset 0 1px 0 rgb(255 255 255 / .25), inset 0 -2px 0 rgb(0 0 0 / .18), 0 4px 8px rgb(0 0 0 / .14), 0 8px 16px rgb(0 0 0 / .1)"
    shadow-raised-pressed: "inset 0 2px 3px rgb(0 0 0 / .25)"
    shadow-raised-rim: "inset 0 1px 0 rgb(255 255 255 / .6)"
    shadow-raised-sm: "inset 0 1px 0 rgb(255 255 255 / .16), inset 0 -1px 0 rgb(0 0 0 / .10)"
    gradient-raised: "linear-gradient(to bottom, rgb(255 255 255 / .08), transparent)"
  dark:
    shadow-rest: "0 1px 2px rgba(0, 0, 0, 0.24)"
    shadow-hover: "0 4px 12px rgba(0, 0, 0, 0.32)"
    shadow-raised: "inset 0 1px 0 rgb(255 255 255 / .25), inset 0 -2px 0 rgb(0 0 0 / .18), 0 2px 4px rgb(0 0 0 / .12), 0 4px 10px rgb(0 0 0 / .08)"
    shadow-raised-hover: "inset 0 1px 0 rgb(255 255 255 / .25), inset 0 -2px 0 rgb(0 0 0 / .18), 0 4px 8px rgb(0 0 0 / .14), 0 8px 16px rgb(0 0 0 / .1)"
    shadow-raised-pressed: "inset 0 2px 3px rgb(0 0 0 / .25)"
    shadow-raised-rim: "inset 0 1px 0 rgb(255 255 255 / .6)"
    shadow-raised-sm: "inset 0 1px 0 rgb(255 255 255 / .16), inset 0 -1px 0 rgb(0 0 0 / .10)"
    gradient-raised: "linear-gradient(to bottom, rgb(255 255 255 / .08), transparent)"
zIndex:
  base: 0
  raised: 10
  overlay: 100
  modal: 200
  dropdown: 300
  tooltip: 400
  toast: 500
breakpoints:
  sm: 640px
  md: 768px
  lg: 1024px
  max-content: 1200px
motion:
  duration-instant: 100ms
  duration-fast: 150ms
  duration-base: 250ms
  duration-slow: 400ms
  duration-focal: 700ms
  duration-spin: 700ms
  duration-loop: 40s
  delay-input: 300ms
  ease-out: "cubic-bezier(0.16, 1, 0.3, 1)"
  ease-in: "cubic-bezier(0.4, 0, 1, 1)"
  ease-in-out: "cubic-bezier(0.65, 0, 0.35, 1)"
  ease-linear: "linear"
  spring: "stiffness 500, damping 40, mass 1"
mix:
  mix-ledge: 20%
  mix-edge: 40%
  mix-icon-edge: 70%
  mix-hover: 8%
  mix-pressed: 10%
  light:
    mix-tint: 14%
  dark:
    mix-tint: 16%
# The photo veil's top 96px (2 × space-12): veil-cover faded in smoothstep, alpha × t²(3−2t), 11 stops
gradients:
  veil-fade: "linear-gradient(to bottom, rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0.0224) 9.6px, rgba(0, 0, 0, 0.0832) 19.2px, rgba(0, 0, 0, 0.1728) 28.8px, rgba(0, 0, 0, 0.2816) 38.4px, rgba(0, 0, 0, 0.4) 48px, rgba(0, 0, 0, 0.5184) 57.6px, rgba(0, 0, 0, 0.6272) 67.2px, rgba(0, 0, 0, 0.7168) 76.8px, rgba(0, 0, 0, 0.7776) 86.4px, rgba(0, 0, 0, 0.8) 96px)"
icons:
  library: Hugeicons
  style: Stroke Rounded
  stroke: 1.5
  sizes: [16, 20, 24]
