colors:
  light:
    glass-fill: "rgba(255, 255, 255, 0.82)"
    glass-fill-strong: "rgba(255, 255, 255, 0.92)"
    glass-border: "rgba(255, 255, 255, 0.40)"
    glass-bar-border: "rgba(0, 0, 0, 0.05)"
  dark:
    glass-fill: "rgba(32, 32, 32, 0.87)"
    glass-fill-strong: "rgba(32, 32, 32, 0.95)"
    glass-border: "rgba(255, 255, 255, 0.20)"
    glass-bar-border: "rgba(255, 255, 255, 0.20)"
shadows:
  light:
    shadow-glass: "0 20px 50px -12px rgba(59, 47, 92, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.50)"
    shadow-glass-layered: "0 1px 2px rgba(59, 47, 92, 0.14), 0 4px 8px rgba(59, 47, 92, 0.12), 0 16px 32px -4px rgba(59, 47, 92, 0.20), 0 36px 70px -14px rgba(59, 47, 92, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.50)"
  dark:
    shadow-glass: "0 20px 50px -12px rgba(206, 190, 245, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.50)"
    shadow-glass-layered: "0 1px 2px rgba(206, 190, 245, 0.14), 0 4px 8px rgba(206, 190, 245, 0.12), 0 16px 32px -4px rgba(206, 190, 245, 0.20), 0 36px 70px -14px rgba(206, 190, 245, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.50)"
glass:
  light:
    glass-blur-card: 20px
    glass-blur-bar: 12px
    glass-blur-float: 30px
    glass-saturate: 140%
  dark:
    glass-blur-card: 24px
    glass-blur-bar: 12px
    glass-blur-float: 30px
    glass-saturate: 140%
# glass-gradient: the candidate background behind the glass; Page background keeps its two glows until a rule adopts it (#6).
gradients:
  light:
    glass-gradient: "linear-gradient(to right top, #cebef5, #f2b3e3, #ffabc3, #ffac9c, #ffb779)"
  dark:
    glass-gradient: "linear-gradient(to right top, #3b2f5c, #713063, #a03056, #be4538, #c16c00)"
